<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title description">
  <title id="title">Five dates in the history of the Sui dynasty</title>
  <desc id="description">A horizontal timeline marks the Sui foundation in 581, reunification in 589, major canal and capital work in 605, the first great Goguryeo invasion in 612, and the end of the dynasty in 618.</desc>
  <rect width="1400" height="520" fill="#f4f1e8"/>
  <text x="70" y="82" fill="#111111" font-family="Georgia, serif" font-size="36">The Sui dynasty in five dates</text>
  <text x="70" y="120" fill="#607969" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">581 TO 618</text>
  <line x1="120" y1="258" x2="1280" y2="258" stroke="#607969" stroke-width="4"/>
  <g fill="#111111" font-family="Arial, sans-serif">
    <g transform="translate(120 258)">
      <circle r="12" fill="#9e3c2e"/>
      <text x="0" y="-58" font-size="30" text-anchor="middle">581</text>
      <text x="0" y="48" font-size="18" text-anchor="start">Yang Jian founds Sui</text>
    </g>
    <g transform="translate(410 258)">
      <circle r="12" fill="#9e3c2e"/>
      <text x="0" y="-58" font-size="30" text-anchor="middle">589</text>
      <text x="0" y="48" font-size="18" text-anchor="middle">Chen defeated</text>
      <text x="0" y="74" font-size="18" text-anchor="middle">north and south reunited</text>
    </g>
    <g transform="translate(700 258)">
      <circle r="12" fill="#9e3c2e"/>
      <text x="0" y="-58" font-size="30" text-anchor="middle">605</text>
      <text x="0" y="48" font-size="18" text-anchor="middle">Luoyang and Tongji Canal</text>
      <text x="0" y="74" font-size="18" text-anchor="middle">work begins</text>
    </g>
    <g transform="translate(990 258)">
      <circle r="12" fill="#9e3c2e"/>
      <text x="0" y="-58" font-size="30" text-anchor="middle">612</text>
      <text x="0" y="48" font-size="18" text-anchor="middle">First great Goguryeo</text>
      <text x="0" y="74" font-size="18" text-anchor="middle">invasion fails</text>
    </g>
    <g transform="translate(1280 258)">
      <circle r="12" fill="#9e3c2e"/>
      <text x="0" y="-58" font-size="30" text-anchor="middle">618</text>
      <text x="0" y="48" font-size="18" text-anchor="end">Tang replaces Sui</text>
    </g>
  </g>
  <text x="70" y="462" fill="#607969" font-family="Arial, sans-serif" font-size="16">Major Sui canal work continued in 608 and 610.</text>
</svg>
